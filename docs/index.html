<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cockroach RAG Showdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="bugs" aria-hidden="true"><span>🪳</span><span>🪳</span><span>🪳</span><span>🪳</span><span>🪳</span></div>
    <div class="wrap">
      <h1>Cockroach <em>RAG Showdown</em></h1>
      <p>Same papers. Highest score wins.</p>
      <div class="deadline">
        <div class="dl-top"><span>⏳ Final deadline · Nov 1</span><b id="dl-left"></b></div>
        <div class="dl-bar"><span id="dl-fill"></span></div>
        <div class="dl-dates"><span>Oct 18</span><span>Nov 1</span></div>
      </div>
      <div class="versus"><div id="teams"></div></div>
    </div>
  </header>

  <main class="wrap">
    <section id="leaderboard" class="panel">
      <h2>🏆 Leaderboard</h2>
      <p class="muted">Updated <span id="updated">never</span> · only the Nov 1 final counts</p>
      <div class="tabs" id="tabs">
        <button data-mode="practice" class="active">Practice</button>
        <button data-mode="final">Final</button>
      </div>
      <div class="table-scroll">
        <table id="board">
          <thead><tr><th>#</th><th>Team</th><th>Score</th><th>Latest run</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

  </main>
  <footer>Cockroach Survivor 🪳 · Judge: Huy</footer>
  <script src="app.js"></script>
</body>
</html>
