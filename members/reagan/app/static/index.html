<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Knowledge</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="workspace" class="workspace">
    <aside id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">▲</span>Team Knowledge</div>
      <button id="new-chat" class="new-chat">＋ New chat</button>
      <h2 class="eyebrow">Recent</h2>
      <nav id="history" aria-label="Conversation history"></nav>
      <footer>
        <span id="knowledge-status">Checking knowledge…</span>
        <small id="sync-status"></small>
      </footer>
    </aside>

    <main>
      <header>
        <button id="toggle-sidebar" class="icon" aria-label="Toggle conversation sidebar">☰</button>
        <span id="chat-title">New conversation</span>
        <button id="daily-button" class="icon challenge-icon" aria-label="Open Daily Challenge" title="Daily Challenge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3H8zM6 5H4v16h16V5h-2M9 11h6M9 15h4"/></svg>
        </button>
      </header>
      <div id="conversation">
        <section id="welcome"><span class="brand-mark">▲</span><h1>What would you like to know?</h1><p>Ask a question. Find it in your team's knowledge.</p></section>
        <div id="messages" aria-live="polite"></div>
      </div>
      <div class="composer-area">
        <p id="status" role="status"></p>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="message">Your question</label>
          <textarea id="message" rows="2" maxlength="2000" placeholder="Ask about your team's knowledge…" required></textarea>
          <div class="composer-actions">
            <button id="quiz-command" type="button" class="subtle">/quiz</button>
            <button id="send" type="submit" class="send" aria-label="Send message">↑</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <dialog id="quiz-dialog" aria-labelledby="quiz-title">
    <div class="modal-header"><div><h2 id="quiz-title">Daily Challenge</h2><p id="quiz-subtitle">One question from your team's knowledge</p></div><button id="close-quiz" class="icon" aria-label="Close quiz">×</button></div>
    <p id="quiz-error" role="alert"></p>
    <div id="quiz-body"></div>
  </dialog>
</body>
</html>
